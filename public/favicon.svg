<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Base -->
  <rect width="64" height="64" rx="16" fill="#030712" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" />

  <!-- Outer Cyber Shield -->
  <path d="M32 8L48 16V30C48 42 41 50 32 56C23 50 16 42 16 30V16L32 8Z" 
        fill="url(#glowGrad)" 
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Inner Tech Hunters Core Icon (Monogram TH) -->
  <path d="M25 24H39M32 24V40" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <circle cx="32" cy="32" r="3.5" fill="#38bdf8" />
  
  <!-- Circuit Nodes -->
  <circle cx="25" cy="24" r="1.5" fill="#67e8f9" />
  <circle cx="39" cy="24" r="1.5" fill="#67e8f9" />
  <circle cx="32" cy="40" r="1.5" fill="#818cf8" />
</svg>